# Omarchy overlay for common/tmux/tmux.conf. Linked by link-linux.sh into
# ~/.config/hatdots/os.tmux.conf.

# `omarchy-menu-tmux-keybindings` only exists on Omarchy; keeping this bind
# out of common/tmux/tmux.conf means `?` is simply unbound everywhere else.
bind ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"
