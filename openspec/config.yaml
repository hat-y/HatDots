# OpenSpec configuration for HatDots
# Generated by SDD init phase (manual fallback after sdd-init subagent timeout).
# Project: HatDots dotfiles repo (engram project: hatdots)
# Change: add-salesforce-nvim-integration

project: hatdots
description: >
  HatDots is a personal dotfiles repo with a Linux/Windows dual layout
  (HatLinux/, HatWindows/, shared/). The Linux side ships a LazyVim-based
  neovim configuration; the Windows side ships a parallel nvim config and
  PowerShell/Wezterm tooling. No application test runner is present.

# ─── Artifact store (from session preflight) ────────────────────────────────
artifact_store: engram
# Non-authoritative store carve-out is ACTIVE: native SDD status engine
# blockedReasons/not_applicable are NOT real blockers. Resolve readiness
# from Engram topic keys (sdd/<change>/<artifact>).
non_authoritative_store_carve_out: true

# Engram topic key convention
engram_topic_key_template: "sdd/{change}/{artifact}"

# ─── Execution model (from session preflight) ───────────────────────────────
execution_mode: interactive
chained_pr_strategy: auto-forecast
review_budget_lines: 400

# ─── Testing ────────────────────────────────────────────────────────────────
strict_tdd: false
# No test runner exists. This is a dotfiles repo, not application code.
test_command: null

# ─── Phase rules ───────────────────────────────────────────────────────────
phase_rules:
  - init
  - explore
  - proposal
  - spec
  - design
  - tasks
  - apply
  - verify
  - sync
  - archive

# ─── Convention notes (for cross-platform nvim work) ───────────────────────
platforms:
  - path: HatLinux/nvim
    plugin_manager: lazy.nvim
    base: LazyVim
  - path: HatWindows/nvim
    plugin_manager: lazy.nvim
    base: LazyVim