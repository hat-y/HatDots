onboarding = false
# herdr configuration managed by HatDots.
# This file is symlinked into ~/.config/herdr/config.toml during installation.
#
# Source: adapted from Gentleman.Dots/herdr/config.toml
# (https://github.com/Gentleman-Programming/Gentleman.Dots)
#
# Tested against Herdr v0.4.x. Upstream license: NOASSERTION.
# See HatLinux/herdr/README.md for install instructions, version notes,
# and the Windows / WSL guidance.

[theme]
# Use a built-in dark theme with neutral foregrounds so Herdr does not inherit
# Ghostty bright-black selected rows or Kanagawa's warm/yellow label text.
name = "kanagawa"

auto_switch = false
[theme.custom]
# Pi-matching palette (panel_bg matches the Gentleman Ghostty theme base).
panel_bg = "#06080f"
accent = "#6FA0AF"
green = "#B7CC85"
blue = "#6FA0AF"
red = "#CB7C94"
yellow = "#DEBA87"

[ui]
accent = "#6FA0AF"

show_agent_labels_on_pane_borders = true
[keys]
# Match tmux/Zellij-style prefix muscle memory.
prefix = "ctrl+a"

# Move between agents in the sidebar.
# Avoid Herdr's built-in prefix+shift+j/k pane-swap bindings.
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# Jump straight to agent N (1..9) as listed in the sidebar.
# Use Ctrl after the prefix: Alt+number is owned by skhd/yabai spaces,
# and Shift+number did not reach Herdr reliably in the current terminal setup.
focus_agent = "prefix+ctrl+1..9"

[ui.toast]
delivery = "herdr"
