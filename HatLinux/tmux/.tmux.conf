# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              TMUX CONFIG                                     │
# └────────────────────────────────────────────────────────────────────────────────┘
#
# Theme: Catppuccin Mocha
# Prefix: Ctrl+Space
#
# Para usar: hacer link a ~/.tmux.conf
#
# Requerimientos: 
#   - tmux 2.0+
#   - Plugins: TPM, tmux-cpu, tmux-plugin-ram
#
# Atajos principales:
#   - Ctrl+Space: Prefix (antes era Ctrl+b)
#   - Ctrl+Space s: Menú de sesiones
#   - Ctrl+Space N: Crear nueva sesión
#   - Ctrl+Space C-k: Matar sesión actual
#   - Alt+h/l: Navegar entre ventanas

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              PLUGINS                                         │
# └────────────────────────────────────────────────────────────────────────────────┘

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugin-ram'

# Inicializar TPM
run '~/.tmux/plugins/tpm/tpm'

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              PREFIX                                         │
# └────────────────────────────────────────────────────────────────────────────────┘

unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                         CATPPUCCIN THEME                                    │
# └────────────────────────────────────────────────────────────────────────────────┘

# Colores Catppuccin Mocha
set -g status-bg '#1e1e2e'
set -g status-fg '#cdd6f4'

# Status bar izquierda (sesión)
set -g status-left '#[fg=#1e1e2e,bg=#fab387,bold] #S '

# Status bar derecha (CPU, RAM, hora)
set -g status-right '#[fg=#1e1e2e,bg=#89b4fa] #{cpu_percentage}% #[fg=#1e1e2e,bg=#f5c2e7] #{ram_percentage}% #[fg=#1e1e2e,bg=#6c7086] %H:%M '

# Formato de ventanas
set -g window-status-format '#[fg=#6c7086,bg=#1e1e2e] #I:#W '
set -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W '

# Actualizar status cada 2 segundos
set -g status-interval 2

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                            SESSION SWITCHER                                  │
# └────────────────────────────────────────────────────────────────────────────────┘

# Ctrl+Space s = elegir sesión
bind s choose-tree -Zs

# Ctrl+Space Shift+n = crear sesión nueva con 2 ventanas
bind N command-prompt -p "Nombre de sesión:" "run-shell '~/.local/bin/ghostty-tmux-new %%'"

# Ctrl+Space Ctrl+k = matar sesión actual
bind C-k confirm-before -p "Kill session #S? (y/n)" kill-session

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              NAVIGATION                                      │
# └────────────────────────────────────────────────────────────────────────────────┘

# Navegación entre ventanas con Alt+hjkl
bind -n M-h previous-window
bind -n M-l next-window

# Paneles (splits)
bind | split-window -h
bind - split-window -v

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              MISC                                            │
# └────────────────────────────────────────────────────────────────────────────────┘

# Mouse support
set -g mouse on

# Historial más grande
set -g history-limit 10000

# Empezar ventanas en 1
set -g base-index 1

# Renombrar ventanas automáticamente
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'