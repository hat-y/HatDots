# Default shell - zsh
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

# Carga TPM
set -g @plugin 'tmux-plugins/tpm'

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux Navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Tmux Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Floating window
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  # open in the same directory of the current pane
  display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

# ═══════════════════════════════════════════════════════════════════════════════
# GENTLEMAN THEME - Colors matching Ghostty Gentleman theme
# ═══════════════════════════════════════════════════════════════════════════════

# Status bar colors - Gentleman theme
set -g status-style 'bg=#06080f,fg=#f3f6f9'
set -g status-left-style 'bg=#06080f,fg=#f3f6f9'
set -g status-right-style 'bg=#06080f,fg=#8a8fa3'

# Window status
set -g window-status-style 'bg=#06080f,fg=#8a8fa3'
set -g window-status-current-style 'bg=#263356,fg=#f3f6f9'
set -g window-status-activity-style 'bg=#06080f,fg=#cb7c94'
set -g window-status-bell-style 'bg=#06080f,fg=#ffe066'

# Pane border colors
set -g pane-border-style 'bg=#06080f,fg=#263356'
set -g pane-active-border-style 'bg=#06080f,fg=#7fb4ca'

# Message colors
set -g message-style 'bg=#263356,fg=#f3f6f9'
set -g message-command-style 'bg=#263356,fg=#f3f6f9'

# Selection
set -g -a terminal-overrides '*:Ms=\E]52;%p1%s;%p2%s\007'

# ─────────────────────────────────────────────────────────────────────────────
# Status bar - Minimal y pegado al borde
# ─────────────────────────────────────────────────────────────────────────────
set -g status-position top
set -g status-left-length 0
set -g status-right-length 50
set -g status-left ""
set -g status-right "#[fg=#8a8fa3,bg=#06080f]#S"

# --- terminal & key handling ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

set -s extended-keys off

# Modo vim
set -g mode-keys vi
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# Keymaps - PREFIX CTRL+SPACE
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# ─────────────────────────────────────────────────────────────────────────────
# Status bar - Minimal y pegado al borde
# ─────────────────────────────────────────────────────────────────────────────
set -g status-position top
set -g status-left-length 0
set -g status-right-length 50
set -g status-left ""
set -g status-right "#[fg=#8a8fa3,bg=#06080f]#S"
set -g status-interval 0

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1

# TPM init
run '~/.tmux/plugins/tpm/tpm'
