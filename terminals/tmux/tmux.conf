# ═══════════════════════════════════════════════════════════════════════════════
# TMUX CONFIG — HatDots base (TPM, Gentleman) + Omarchy binds
# ═══════════════════════════════════════════════════════════════════════════════

# Default shell
set -g default-shell /usr/bin/fish
set -g default-command /usr/bin/fish

# ── TPM plugins ───────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ── Auto-save & restore ─────────────────────────────────────────────────────────
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# ── Scratch popup ─────────────────────────────────────────────────────────────

bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

# ── Gentleman Theme ───────────────────────────────────────────────────────────

set -g status-style 'bg=#06080f,fg=#f3f6f9'
set -g status-left-style 'bg=#06080f,fg=#f3f6f9'
set -g status-right-style 'bg=#06080f,fg=#8a8fa3'

set -g window-status-style 'bg=#06080f,fg=#8a8fa3'
set -g window-status-current-style 'bg=#263356,fg=#f3f6f9'
set -g window-status-activity-style 'bg=#06080f,fg=#cb7c94'
set -g window-status-bell-style 'bg=#06080f,fg=#ffe066'

set -g pane-border-style 'bg=#06080f,fg=#263356'
set -g pane-active-border-style 'bg=#06080f,fg=#7fb4ca'

set -g message-style 'bg=#263356,fg=#f3f6f9'
set -g message-command-style 'bg=#263356,fg=#f3f6f9'

set -g -a terminal-overrides '*:Ms=\E]52;%p1%s;%p2%s\007'

# ── Status bar — Minimal ──────────────────────────────────────────────────────

set -g status-position top
set -g status-left-length 0
set -g status-right-length 50
set -g status-left ""
set -g status-right "#[fg=#8a8fa3,bg=#06080f]#S"
set -g status-interval 5
set -g status-justify left

# ── Terminal & keys ───────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u

set -s extended-keys on

# ── Vi mode ───────────────────────────────────────────────────────────────────

set -g mode-keys vi
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"

# ── Prefix ────────────────────────────────────────────────────────────────────

unbind C-b
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# ── Panes ─────────────────────────────────────────────────────────────────────

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"
bind x kill-pane

# Pane navigation
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

# Pane resize
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# ── Windows ───────────────────────────────────────────────────────────────────

bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# ── Sessions ──────────────────────────────────────────────────────────────────

bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# ── Reload ────────────────────────────────────────────────────────────────────

bind q source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── TPM init ──────────────────────────────────────────────────────────────────

run '~/.tmux/plugins/tpm/tpm'
